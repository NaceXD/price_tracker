version: '3.8'

services:
  web:
    build: .
    container_name: price_tracker_web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - POSTGRES_HOST=postgres_db
      - REDIS_HOST=redis_cache
    depends_on:
      - postgres_db
      - redis_cache
  postgres_db:
    image: postgres:15.3-alpine
    container_name: price_tracker_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis_cache:
    image: redis:7.0.11-alpine
    container_name: price_tracker_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data: