services:
  web:
    build: .
    container_name: price_tracker_web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - POSTGRES_HOST=postgres_db
      - REDIS_HOST=redis_cache
    depends_on:
      - postgres_db
      - redis_cache
    networks:
      - tracker_network
  celery_worker:
    build: .
    container_name: price_tracker_worker
    command: watchmedo auto-restart --directory=./src --pattern="*.py" --recursive -- celery -A src.core.celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - POSTGRES_HOST=postgres_db
      - REDIS_HOST=redis_cache
    depends_on:
      - postgres_db
      - redis_cache
    networks:
      - tracker_network
  celery_beat:
    build: .
    container_name: price_tracker_beat
    command: celery -A src.core.celery_app beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - POSTGRES_HOST=postgres_db
      - REDIS_HOST=redis_cache
    depends_on:
      - postgres_db
      - redis_cache
    networks:
      - tracker_network
  postgres_db:
    image: postgres:16-alpine
    restart: always
    container_name: price_tracker_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tracker_network
  redis_cache:
    image: redis:7.0.11-alpine
    container_name: price_tracker_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tracker_network
volumes:
  postgres_data:
  redis_data:

networks:
  tracker_network:
    driver: bridge